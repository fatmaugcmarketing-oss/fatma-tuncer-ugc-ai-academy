<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UGC&Aİ Collaby Academy</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080914;
      color: white;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: auto;
    }

    /* NAVBAR */

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(8, 9, 20, 0.92);
      border-bottom: 1px solid #25273a;
      backdrop-filter: blur(10px);
    }

    nav {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
    }

    .logo span {
      color: #a855f7;
    }

    .menu {
      display: flex;
      gap: 24px;
      color: #b8bbca;
      font-size: 14px;
    }

    .menu a:hover {
      color: white;
    }

    /* BUTTON */

    .button {
      display: inline-block;
      padding: 13px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
      font-weight: bold;
    }
